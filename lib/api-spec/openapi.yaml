          type: number
        weekSales:
          type: integer
        weekRevenue:
          type: number
        monthSales:
          type: integer
        monthRevenue:
          type: number
        totalRevenue:
          type: number
        totalProfit:
          type: number
        totalExpenses:
          type: number
        outstandingDebtors:
          type: number
        outstandingCreditors:
          type: number

    TopProduct:
      type: object
      required: [productId, productName, totalQuantity, totalRevenue]
      properties:
        productId:
          type: integer
        productName:
          type: string
        sku:
          type: ["string", "null"]
        totalQuantity:
          type: number
        totalRevenue:
          type: number

    RecentTransaction:
